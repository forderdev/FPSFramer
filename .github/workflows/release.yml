name: Release

# Builds the Windows installer. A pushed version tag (v*) also publishes it as a GitHub release;
# a manual run only produces a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - name: Install the Tauri CLI (prebuilt, from npm)
        run: npm install --global @tauri-apps/cli@2
      - name: Build the installer
        working-directory: app/src-tauri
        run: tauri build
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FPSFramer-windows-installer
          path: target/release/bundle/nsis/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
          generate_release_notes: true
