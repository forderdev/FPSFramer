name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust (Linux) – tests, clippy, Windows type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build the UI (the desktop shell embeds it)
        run: npm --prefix ui ci && npm --prefix ui run build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The desktop shell is excluded here: cross-compiling its Windows resources needs llvm-rc. It is linted for
      # real by the Windows job below.
      - name: Type-check the Windows-only code (cross-target)
        run: cargo clippy --target x86_64-pc-windows-msvc --workspace --exclude fpsframer-app --all-targets -- -D warnings

  ui:
    name: UI – type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm --prefix ui ci
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test
      - run: npm --prefix ui run build

  e2e:
    name: End-to-end + accessibility (demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cd ui && npx playwright install --with-deps chromium
      - run: npm --prefix ui run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: ui/test-results

  windows-tests:
    name: Windows – tests on a real Windows runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs the sensor providers (performance counters, WMI, DXGI …) for real on a Windows runner.
      - run: cargo test -p fpsframer-core -p fpsframer-platform -p fpsframer-engine
      - name: Lint everything for Windows, including the desktop shell
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows-installer:
    name: Windows – installer (download from the run's Artifacts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - name: Install the Tauri CLI (prebuilt, from npm)
        run: npm install --global @tauri-apps/cli@2
      - name: Build the installer
        working-directory: app/src-tauri
        run: tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: FPSFramer-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
